<dialog class="dialog" appModal aria-labelledby="form-heading" (dismissed)="cancel.emit()">
  <h2 id="form-heading" class="dialog-title">{{ heading() }}</h2>
  <form class="flex flex-col gap-4 p-6" novalidate (submit)="onSubmit($event)">
    <div class="flex flex-col gap-1">
      <label class="field-label" for="book-title">Title</label>
      <input
        id="book-title"
        type="text"
        required
        class="field-input aria-invalid:border-danger"
        [value]="title()"
        [attr.aria-invalid]="errors().title ? true : null"
        [attr.aria-describedby]="errors().title ? 'title-error' : null"
        (input)="title.set(value($event))"
      />
      @if (errors().title) {
        <p class="text-sm font-black text-danger uppercase" id="title-error">{{ errors().title }}</p>
      }
    </div>
    <div class="flex flex-col gap-1">
      <label class="field-label" for="book-author">Author</label>
      <input
        id="book-author"
        type="text"
        required
        class="field-input aria-invalid:border-danger"
        [value]="author()"
        [attr.aria-invalid]="errors().author ? true : null"
        [attr.aria-describedby]="errors().author ? 'author-error' : null"
        (input)="author.set(value($event))"
      />
      @if (errors().author) {
        <p class="text-sm font-black text-danger uppercase" id="author-error">{{ errors().author }}</p>
      }
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="field-label" for="book-status">Status</label>
        <select id="book-status" class="field-input" (change)="onStatus($event)">
          @for (option of statuses; track option.value) {
            <option [value]="option.value" [selected]="option.value === status()">{{ option.label }}</option>
          }
        </select>
      </div>
      <div class="flex flex-col gap-1">
        <label class="field-label" for="book-rating">Rating</label>
        <select id="book-rating" class="field-input" (change)="onRating($event)">
          <option value="" [selected]="rating() === null">Not rated</option>
          @for (n of ratings; track n) {
            <option [value]="n" [selected]="rating() === n">{{ n }}</option>
          }
        </select>
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label class="field-label" for="book-notes">Notes</label>
      <textarea
        id="book-notes"
        rows="3"
        class="field-input"
        [value]="notes()"
        (input)="notes.set(value($event))"
      ></textarea>
    </div>
    <div class="mt-2 flex justify-end gap-3">
      <button type="button" class="btn" (click)="cancel.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>
