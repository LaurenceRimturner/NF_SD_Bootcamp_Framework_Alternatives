<dialog class="dialog" appModal aria-labelledby="form-heading" (dismissed)="cancel.emit()">
  <h2 id="form-heading">{{ heading() }}</h2>
  <form novalidate (submit)="onSubmit($event)">
    <div class="field">
      <label for="book-title">Title</label>
      <input
        id="book-title"
        type="text"
        required
        [value]="title()"
        [attr.aria-invalid]="errors().title ? true : null"
        [attr.aria-describedby]="errors().title ? 'title-error' : null"
        (input)="title.set(value($event))"
      />
      @if (errors().title) {
        <p class="error" id="title-error">{{ errors().title }}</p>
      }
    </div>
    <div class="field">
      <label for="book-author">Author</label>
      <input
        id="book-author"
        type="text"
        required
        [value]="author()"
        [attr.aria-invalid]="errors().author ? true : null"
        [attr.aria-describedby]="errors().author ? 'author-error' : null"
        (input)="author.set(value($event))"
      />
      @if (errors().author) {
        <p class="error" id="author-error">{{ errors().author }}</p>
      }
    </div>
    <div class="field">
      <label for="book-status">Status</label>
      <select id="book-status" (change)="onStatus($event)">
        @for (option of statuses; track option.value) {
          <option [value]="option.value" [selected]="option.value === status()">{{ option.label }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="book-rating">Rating</label>
      <select id="book-rating" (change)="onRating($event)">
        <option value="" [selected]="rating() === null">Not rated</option>
        @for (n of ratings; track n) {
          <option [value]="n" [selected]="rating() === n">{{ n }}</option>
        }
      </select>
    </div>
    <div class="field">
      <label for="book-notes">Notes</label>
      <textarea id="book-notes" rows="3" [value]="notes()" (input)="notes.set(value($event))"></textarea>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" (click)="cancel.emit()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>
