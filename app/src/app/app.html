<header class="border-b-8 border-ink bg-accent">
  <div class="mx-auto flex max-w-7xl flex-wrap items-end justify-between gap-4 p-4 sm:p-6">
    <div>
      <h1 class="text-4xl leading-none font-black tracking-tighter uppercase sm:text-6xl">Reading List</h1>
      <p class="mt-2 text-sm font-black tracking-wide uppercase">
        {{ visibleBooks().length }} / {{ books().length }} books
      </p>
    </div>
    <button type="button" class="btn bg-ink text-accent hover:bg-surface hover:text-ink" (click)="openAdd()">
      + Add book
    </button>
  </div>
</header>

<main class="mx-auto flex max-w-7xl flex-col gap-6 p-4 sm:p-6">
  <app-toolbar
    [query]="query()"
    [status]="status()"
    (queryChange)="query.set($event)"
    (statusChange)="status.set($event)"
  />

  @if (visibleBooks().length > 0) {
    <ul class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (book of visibleBooks(); track book.id) {
        <li>
          <app-book-card [book]="book" (edit)="openEdit($event)" (remove)="deleting.set($event)" />
        </li>
      }
    </ul>
  } @else {
    <app-empty-state />
  }
</main>

@if (formOpen()) {
  <app-book-form-dialog [book]="editing()" (save)="saveBook($event)" (cancel)="closeForm()" />
}

@if (deleting(); as book) {
  <app-confirm-dialog [title]="book.title" (confirm)="confirmDelete()" (cancel)="deleting.set(null)" />
}

<app-toast [message]="toast()" />
